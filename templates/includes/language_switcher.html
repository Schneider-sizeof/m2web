{% load static i18n %}
{% get_current_language as CURRENT_LANG %}

<!-- Desktop Dropdown (d-none d-lg-block) -->
<div class="dropdown lang-switcher d-none d-lg-block">
    <button class="btn btn-sm text-white dropdown-toggle border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        {% if CURRENT_LANG == 'fr' %}
            <img src="{% static 'images/flags/fr.svg' %}" width="18" height="12" class="me-1 rounded-1 align-baseline" alt="FR"> FR
        {% elif CURRENT_LANG == 'ar' %}
            <img src="{% static 'images/flags/ma.svg' %}" width="18" height="12" class="me-1 rounded-1 align-baseline" alt="AR"> AR
        {% else %}
            <img src="{% static 'images/flags/gb.svg' %}" width="18" height="12" class="me-1 rounded-1 align-baseline" alt="EN"> EN
        {% endif %}
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow">
        <li>
            <form action="{% url 'set_language' %}" method="post" class="m-0">
                {% csrf_token %}
                <input name="next" type="hidden" value="{{ request.get_full_path }}">
                <input name="language" type="hidden" value="fr">
                <button type="submit" class="dropdown-item d-flex align-items-center {% if CURRENT_LANG == 'fr' %}active{% endif %}">
                    <img src="{% static 'images/flags/fr.svg' %}" width="20" height="14" class="me-2 rounded-1" alt="FR">
                    <span>Français</span>
                </button>
            </form>
        </li>
        <li>
            <form action="{% url 'set_language' %}" method="post" class="m-0">
                {% csrf_token %}
                <input name="next" type="hidden" value="{{ request.get_full_path }}">
                <input name="language" type="hidden" value="ar">
                <button type="submit" class="dropdown-item d-flex align-items-center {% if CURRENT_LANG == 'ar' %}active{% endif %}">
                    <img src="{% static 'images/flags/ma.svg' %}" width="20" height="14" class="me-2 rounded-1" alt="AR">
                    <span>العربية</span>
                </button>
            </form>
        </li>
        <li>
            <form action="{% url 'set_language' %}" method="post" class="m-0">
                {% csrf_token %}
                <input name="next" type="hidden" value="{{ request.get_full_path }}">
                <input name="language" type="hidden" value="en">
                <button type="submit" class="dropdown-item d-flex align-items-center {% if CURRENT_LANG == 'en' %}active{% endif %}">
                    <img src="{% static 'images/flags/gb.svg' %}" width="20" height="14" class="me-2 rounded-1" alt="EN">
                    <span>English</span>
                </button>
            </form>
        </li>
    </ul>
</div>

<!-- Mobile Segmented Language Strip (d-lg-none) -->
<div class="mobile-lang-strip d-lg-none mt-3 pt-3 border-top border-white border-opacity-10">
    <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="text-white-50 small fw-semibold">
            <i class="bi bi-translate text-amber me-1"></i>{% trans 'Langue' %}
        </span>
        <span class="badge bg-plum border border-amber border-opacity-25 text-amber text-uppercase" style="font-size: 0.65rem;">
            {{ CURRENT_LANG }}
        </span>
    </div>
    <div class="row g-2">
        <div class="col-4">
            <form action="{% url 'set_language' %}" method="post" class="m-0">
                {% csrf_token %}
                <input name="next" type="hidden" value="{{ request.get_full_path }}">
                <input name="language" type="hidden" value="fr">
                <button type="submit" class="btn btn-sm w-100 py-2 d-flex align-items-center justify-content-center gap-1 {% if CURRENT_LANG == 'fr' %}btn-amber fw-bold shadow-sm{% else %}btn-outline-light text-white-50 border-opacity-25{% endif %}">
                    <img src="{% static 'images/flags/fr.svg' %}" width="16" height="11" class="rounded-1" alt="FR">
                    <span>Français</span>
                </button>
            </form>
        </div>
        <div class="col-4">
            <form action="{% url 'set_language' %}" method="post" class="m-0">
                {% csrf_token %}
                <input name="next" type="hidden" value="{{ request.get_full_path }}">
                <input name="language" type="hidden" value="ar">
                <button type="submit" class="btn btn-sm w-100 py-2 d-flex align-items-center justify-content-center gap-1 {% if CURRENT_LANG == 'ar' %}btn-amber fw-bold shadow-sm{% else %}btn-outline-light text-white-50 border-opacity-25{% endif %}">
                    <img src="{% static 'images/flags/ma.svg' %}" width="16" height="11" class="rounded-1" alt="AR">
                    <span>العربية</span>
                </button>
            </form>
        </div>
        <div class="col-4">
            <form action="{% url 'set_language' %}" method="post" class="m-0">
                {% csrf_token %}
                <input name="next" type="hidden" value="{{ request.get_full_path }}">
                <input name="language" type="hidden" value="en">
                <button type="submit" class="btn btn-sm w-100 py-2 d-flex align-items-center justify-content-center gap-1 {% if CURRENT_LANG == 'en' %}btn-amber fw-bold shadow-sm{% else %}btn-outline-light text-white-50 border-opacity-25{% endif %}">
                    <img src="{% static 'images/flags/gb.svg' %}" width="16" height="11" class="rounded-1" alt="EN">
                    <span>English</span>
                </button>
            </form>
        </div>
    </div>
</div>
