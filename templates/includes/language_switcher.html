{% load static i18n %}
<div class="dropdown lang-switcher">
    {% get_current_language as CURRENT_LANG %}
    <button class="btn btn-sm text-white dropdown-toggle border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        {% if CURRENT_LANG == 'fr' %}
            <img src="{% static 'images/flags/fr.svg' %}" width="18" height="12" class="me-1 rounded-1 align-baseline" alt="FR"> FR
        {% elif CURRENT_LANG == 'ar' %}
            <img src="{% static 'images/flags/ma.svg' %}" width="18" height="12" class="me-1 rounded-1 align-baseline" alt="AR"> AR
        {% else %}
            <img src="{% static 'images/flags/gb.svg' %}" width="18" height="12" class="me-1 rounded-1 align-baseline" alt="EN"> EN
        {% endif %}
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow">
        <li>
            <form action="{% url 'set_language' %}" method="post" class="m-0">
                {% csrf_token %}
                <input name="next" type="hidden" value="{{ request.get_full_path }}">
                <input name="language" type="hidden" value="fr">
                <button type="submit" class="dropdown-item d-flex align-items-center {% if CURRENT_LANG == 'fr' %}active{% endif %}">
                    <img src="{% static 'images/flags/fr.svg' %}" width="20" height="14" class="me-2 rounded-1" alt="FR">
                    <span>Français</span>
                </button>
            </form>
        </li>
        <li>
            <form action="{% url 'set_language' %}" method="post" class="m-0">
                {% csrf_token %}
                <input name="next" type="hidden" value="{{ request.get_full_path }}">
                <input name="language" type="hidden" value="ar">
                <button type="submit" class="dropdown-item d-flex align-items-center {% if CURRENT_LANG == 'ar' %}active{% endif %}">
                    <img src="{% static 'images/flags/ma.svg' %}" width="20" height="14" class="me-2 rounded-1" alt="AR">
                    <span>العربية</span>
                </button>
            </form>
        </li>
        <li>
            <form action="{% url 'set_language' %}" method="post" class="m-0">
                {% csrf_token %}
                <input name="next" type="hidden" value="{{ request.get_full_path }}">
                <input name="language" type="hidden" value="en">
                <button type="submit" class="dropdown-item d-flex align-items-center {% if CURRENT_LANG == 'en' %}active{% endif %}">
                    <img src="{% static 'images/flags/gb.svg' %}" width="20" height="14" class="me-2 rounded-1" alt="EN">
                    <span>English</span>
                </button>
            </form>
        </li>
    </ul>
</div>
